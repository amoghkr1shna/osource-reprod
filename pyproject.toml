[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "osource-reprod"
version = "0.1.0"
description = "Open source reproducibility project"
authors = [
    { name = "Amogh Krishna", email = "ak12141@nyu.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "mkdocs",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "coverage",
]



[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["osource_reprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
packages = ["osource_reprod"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
